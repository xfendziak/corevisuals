<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreVisuals — Studio & Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050208;
            --accent: #7b2cbf; /* Głęboki, szlachetny fiolet */
            --text: #f8f7f9;
            --muted: #888;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 40px;
        }

        header {
            padding: 100px 0 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            letter-spacing: -1px;
            font-size: 1.5rem;
            text-transform: lowercase;
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-left: 30px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        section {
            margin-bottom: 120px;
        }

        h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 40px;
        }

        p.intro {
            font-size: 1.8rem;
            line-height: 1.4;
            font-weight: 300;
            max-width: 600px;
        }

        /* Sklep - Minimalistyczna lista */
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px 40px;
        }

        .product {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-img {
            aspect-ratio: 1/1;
            background: #0d0616;
            margin-bottom: 15px;
            transition: opacity 0.3s;
        }

        .product:hover .product-img {
            opacity: 0.7;
        }

        .product-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .product-price {
            color: var(--muted);
        }

        footer {
            padding-bottom: 60px;
            font-size: 0.8rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 600px) {
            header { padding: 40px 0; flex-direction: column; gap: 20px; }
            .shop-grid { grid-template-columns: 1fr; }
            p.intro { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <div class="logo">CoreVisuals.</div>
        <nav>
            <a href="#store">Store</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="about">
        <p class="intro">
            Tworzymy wizualną esencję. Projektujemy dla tych, którzy widzą więcej. Sklep i kolekcja CoreVisuals.
        </p>
    </section>

    <section id="store">
        <h2>Selected Items</h2>
        <div class="shop-grid">
            <a href="mailto:order@corevisuals.pl" class="product">
                <div class="product-img"></div>
                <div class="product-info">
                    <span>Essential Hoodie</span>
                    <span class="product-price">249 PLN</span>
                </div>
            </a>
            <a href="mailto:order@corevisuals.pl" class="product">
                <div class="product-img"></div>
                <div class="product-info">
                    <span>Visual Pack .01</span>
                    <span class="product-price">99 PLN</span>
                </div>
            </a>
            <a href="mailto:order@corevisuals.pl" class="product">
                <div class="product-img"></div>
                <div class="product-info">
                    <span>Logo Tee</span>
                    <span class="product-price">129 PLN</span>
                </div>
            </a>
        </div>
    </section>

    <footer id="contact">
        <div>© 2026 CoreVisuals</div>
        <div>ig: @corevisuals • hello@corevisuals.pl</div>
    </footer>
</div>

</body>
</html>
