<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreVisual Studio | Creative Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #050208;
            --primary: #c084fc;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(192, 132, 252, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* ANIMOWANE GWIAZDY */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #11081f 0%, #050208 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: moveStars linear infinite;
        }

        @keyframes moveStars {
            from { transform: translateY(0); }
            to { transform: translateY(-1000px); }
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 10%;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--primary); }

        .btn-discord {
            border: 1px solid var(--primary);
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            background: rgba(192, 132, 252, 0.1);
            transition: 0.3s;
        }

        .btn-discord:hover { background: var(--primary); color: black; }

        /* HERO */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 4.5rem;
            margin: 0;
            background: linear-gradient(to bottom, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(192, 132, 252, 0.4));
        }

        .hero p {
            color: #94a3b8;
            max-width: 600px;
            margin: 20px auto;
        }

        /* STATS & TOOLS */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 100px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: 0.4s ease;
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-10px);
            box-shadow: 0 10px 40px rgba(192, 132, 252, 0.1);
        }

        .card h2 { font-size: 3rem; margin: 0; }
        .card span { color: #94a3b8; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 50px;
        }

        .tool {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .tool i { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; display: block; }
        .tool:hover { background: rgba(255,255,255,0.05); }

        @media (max-width: 768px) {
            .tools-grid { grid-template-columns: repeat(2, 1fr); }
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="stars-container" id="stars"></div>

    <header>
        <div class="logo"><strong>CORE</strong>VISUAL</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Portfolio</a>
            <a href="#">Store</a>
        </div>
        <a href="#" class="btn-discord"><i class="fab fa-discord"></i> DOŁĄCZ</a>
    </header>

    <section class="hero">
        <h1>COREVISUAL STUDIO</h1>
        <p>Tworzymy cyfrową przyszłość. Design, który przyciąga wzrok i kod, który nie zawodzi.</p>
    </section>

    <div class="container">
        <div class="grid">
            <div class="card">
                <h2>1</h2>
                <span>Rok pasji</span>
            </div>
            <div class="card">
                <h2>28</h2>
                <span>Projektów</span>
            </div>
            <div class="card">
                <h2>24/7</h2>
                <span>Support</span>
            </div>
        </div>

        <h3 style="text-align: center; letter-spacing: 3px; color: #94a3b8;">STREFA NARZĘDZI</h3>
        
        <div class="tools-grid">
            <div class="tool"><i class="fab fa-js"></i><span>JS</span></div>
            <div class="tool"><i class="fas fa-terminal"></i><span>CMD</span></div>
            <div class="tool"><i class="fas fa-palette"></i><span>UI/UX</span></div>
            <div class="tool"><i class="fas fa-code"></i><span>CODE</span></div>
        </div>
    </div>

    <script>
        // Generowanie gwiazd w tle
        const container = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            // Losowa prędkość animacji
            star.style.animationDuration = (Math.random() * 50 + 50) + 's';
            container.appendChild(star);
        }
    </script>

</body>
</html>
